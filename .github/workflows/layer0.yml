name: Layer 0 Conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pmcro-marketplace/skill-agent
          ref: f5e3e934b001918da81588155f0b200a725a1392
          path: .pmcro-validator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python .pmcro-validator/skills/validate/scripts/validate_plugin.py --plugin . --profile pmcro --limits .pmcro-validator/skills/validate/assets/limits.json
